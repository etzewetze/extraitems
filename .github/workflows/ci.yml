name: ExtraItems CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Spigot 1.21.11 / Java 21
            java: "21"
            api_group: org.spigotmc
            api_artifact: spigot-api
            api_version: "1.21.11-R0.1-SNAPSHOT"
            build_paper_api: false
          - label: Spigot 26.2 / Java 25
            java: "25"
            api_group: org.spigotmc
            api_artifact: spigot-api
            api_version: "26.2-R0.1-SNAPSHOT"
            build_paper_api: false
          - label: Paper 26.3 Alpha / Java 25
            java: "25"
            api_group: io.papermc.paper
            api_artifact: paper-api
            api_version: "26.3.local-SNAPSHOT"
            build_paper_api: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Check out pinned Paper 26.3 source
        if: ${{ matrix.build_paper_api }}
        uses: actions/checkout@v7
        with:
          repository: PaperMC/Paper
          ref: cc95f009b7e4b5687feb0a068d9fc44b326dc8c3
          path: paper-26.3
          fetch-depth: 0
      - name: Set up Gradle for Paper API
        if: ${{ matrix.build_paper_api }}
        uses: gradle/actions/setup-gradle@v6
      - name: Build Paper 26.3 API locally
        if: ${{ matrix.build_paper_api }}
        working-directory: paper-26.3
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          ./gradlew applyPatches --stacktrace
          ./gradlew :paper-api:jar :paper-api:generatePomFileForMavenPublication --stacktrace
          mvn -B org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile=paper-api/build/libs/paper-api-26.3.local-SNAPSHOT.jar \
            -DpomFile=paper-api/build/publications/maven/pom-default.xml
      - name: Test against ${{ matrix.label }}
        working-directory: Quellcode
        run: mvn -B clean verify -Dserver.api.group=${{ matrix.api_group }} -Dserver.api.artifact=${{ matrix.api_artifact }} -Dserver.api.version=${{ matrix.api_version }}

  package:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build release JAR
        working-directory: Quellcode
        run: mvn -B clean verify
      - name: Assemble complete package
        run: |
          mkdir -p dist/Quellcode
          cp Quellcode/target/ExtraItems-0.7.1.jar dist/
          cp README.md SCHNELLSTART.txt ASSETS.md dist/
          rsync -a --exclude target Quellcode/ dist/Quellcode/
          cd dist
          zip -r ExtraItems-0.7.1-Komplettpaket.zip ExtraItems-0.7.1.jar README.md SCHNELLSTART.txt ASSETS.md Quellcode
      - uses: actions/upload-artifact@v7
        with:
          name: ExtraItems-0.7.1-Komplettpaket
          path: dist/ExtraItems-0.7.1-Komplettpaket.zip
          if-no-files-found: error
